<!doctype html>
<html lang="uk">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{title}}</title>
  </head>
  <body style="margin:0;padding:0;background-color:#edf7f6;color:#232323;font-family:Arial,sans-serif">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#edf7f6">
      <tr><td align="center" style="padding:32px 16px">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;background-color:#ffffff;border:1px solid #d9e9e8;border-radius:16px">
          <tr><td style="padding:24px 28px;border-top:5px solid #129297;border-radius:16px 16px 0 0">
            <table role="presentation" cellpadding="0" cellspacing="0">
              <tr>
                <!-- icon:start -->
                <td style="padding-right:10px"><img src="cid:{{iconFilename}}" width="40" height="40" alt="" style="display:block;border:0"></td>
                <!-- icon:end -->
                <td style="font-size:17px;line-height:1.35;font-weight:bold;color:#232323">D.Church CRM</td>
              </tr>
            </table>
          </td></tr>
          {{content}}
        </table>
      </td></tr>
    </table>
  </body>
</html>
